version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: jal-sakhi-db
    environment:
      POSTGRES_USER: chirag
      POSTGRES_PASSWORD: chirag
      POSTGRES_DB: jalsakhi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chirag -d jalsakhi"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jal-sakhi-network

  # Node.js Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jal-sakhi-backend
    environment:
      NODE_ENV: production
      PORT: 8080
      PUBLIC_BASE_URL: http://<SERVER_IP>
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: chirag
      PGPASSWORD: chirag
      PGDATABASE: jalsakhi
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      LOG_LEVEL: info
      UPLOAD_DIR: /app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - jal-sakhi-network
    restart: unless-stopped

  # React Web Dashboard + Nginx
  web-dashboard:
    build:
      context: ./web-dashboard
      dockerfile: Dockerfile
    container_name: jal-sakhi-dashboard
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - jal-sakhi-network
    restart: unless-stopped

volumes:
  postgres_data:
  backend_uploads:

networks:
  jal-sakhi-network:
    driver: bridge
