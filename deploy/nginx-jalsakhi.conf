# Jal Sakhi production nginx config — single domain serves dashboard + API + admin.
# __DOMAIN__ is substituted by deploy/vps-setup.sh at install time.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # certbot will rewrite this server block to handle HTTPS + redirect.
    # Until cert is issued, allow plain HTTP so the ACME challenge works.

    client_max_body_size 12M;

    # ───── Manager dashboard (SPA) ─────
    root /var/www/jalsakhi;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ───── Admin connect page (URL + QR generator for KRPs) ─────
    location /admin/ {
        alias /var/www/jalsakhi-admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # ───── Backend API ─────
    # /api/* is what the React dashboard calls. The Vite proxy in dev strips /api,
    # so we do the same here in prod.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # ───── Uploaded photos / audio ─────
    # The backend serves these from /uploads/ directly. We pass them through
    # so the URL stays clean.
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ───── Security headers ─────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS is added automatically by certbot's --redirect after HTTPS is up.

    # ───── Gzip ─────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/json application/xml application/xml+rss image/svg+xml;
}
